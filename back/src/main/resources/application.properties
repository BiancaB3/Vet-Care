spring.application.name=vetcare-back

# -------------------------------------------------------
# Datasource – PostgreSQL
# Arquivo: back/src/main/resources/application.properties
#
# Para sobrescrever localmente sem editar este arquivo,
# defina as variáveis de ambiente abaixo antes de subir:
#   DB_URL      (padrão: jdbc:postgresql://localhost:5432/vetcare_back)
#   DB_USERNAME (padrão: postgres)
#   DB_PASSWORD (padrão: admin)
# -------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vetcare_back}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect